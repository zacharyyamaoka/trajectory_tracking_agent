# Publishes site/ (the landing page) to GitHub Pages on every push to main.
# WHY two jobs (2026-11-24): with upload and deploy in one job, deploy-pages twice found "0 artifacts" 0.3 s after
# a successful upload; GitHub's own static-site template uploads in a build job and deploys in a second job.
name: pages
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: false
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site
  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
