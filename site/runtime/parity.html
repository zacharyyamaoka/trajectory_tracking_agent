<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Runtime parity</title>
<style>
  :root { color-scheme: light dark; --bg: #fff; --fg: #1b1d21; --muted: #5d6470; }
  @media (prefers-color-scheme: dark) { :root { --bg: #14161a; --fg: #e8eaee; --muted: #9aa2ae; } }
  body { margin: 0; padding: 24px 16px; background: var(--bg); color: var(--fg); font: 15px/1.5 system-ui, sans-serif; }
  main { max-width: 760px; margin: 0 auto; }
  pre { white-space: pre-wrap; font: 13px/1.45 ui-monospace, monospace; color: var(--muted); }
</style>
</head>
<body>
<main>
  <h1>Runtime parity</h1>
  <p>Runs one solution on one dev task in this browser (Pyodide + MuJoCo's WASM build) through the ruler's own
  <code>run_task</code>, and prints its tool tracking RMS. Query: <code>?solution=p2&amp;task=workspace-dev-000</code>;
  <code>?what=path&amp;config=P2&amp;deterministic=1</code> for robot_controllers' own UR5e path.</p>
  <pre id="log">starting…</pre>
</main>
<script type="module">
  const log = document.getElementById('log');
  const params = new URLSearchParams(location.search);
  const worker = new Worker(new URL('./worker.js', import.meta.url), {type: 'module'});
  worker.onmessage = (event) => {
    const message = event.data;
    if (message.status) log.textContent += `\n${message.status}`;
    if (message.fatal) { log.textContent += `\n${message.fatal}`; window.__parity = {error: message.fatal}; }
    if (message.error) { log.textContent += `\nerror: ${message.error}`; window.__parity = {error: message.error}; }
    if (message.result) {
      const r = message.result;
      const value = r.row ? r.row.objective : r.metrics.tick_tool_error_rms_mm;
      log.textContent += `\n\nresult = ${value}\ncall ${r.browser.call_s.toFixed(2)} s, boot ${r.browser.boot_s.toFixed(1)} s`;
      window.__parity = r;
    }
  };
  const what = params.get('what') || 'run';
  const kwargs = what === 'path'
    ? {config_id: params.get('config') || 'P2', include_compute: params.get('deterministic') !== '1'}
    : {solution_id: params.get('solution') || 'p2', task_id: params.get('task') || 'workspace-dev-000',
       render: false, pin_calibration: params.get('pin_calibration') === '1'};
  worker.postMessage({id: 1, call: what === 'path' ? 'run_robot_controllers_path' : 'run', kwargs});
</script>
</body>
</html>
