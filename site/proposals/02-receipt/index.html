<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Itemized Receipt</title>
<link rel="stylesheet" href="../_shared/kit.css">
<style>
  .app { display: grid; grid-template-columns: 270px minmax(0, 1fr); gap: 0; min-height: calc(100vh - 96px); }
  .till { border-right: 1px solid var(--line); background: var(--surface); padding: 12px; display: flex; flex-direction: column; gap: 4px; }
  .till .sec { font-size: 11px; text-transform: uppercase; letter-spacing: .05em; color: var(--muted); margin: 10px 0 2px; }
  .till button { display: grid; grid-template-columns: 16px 1fr auto; gap: 6px; align-items: baseline; text-align: left; border: 1px solid transparent; background: none; border-radius: 8px; padding: 6px 8px; cursor: pointer; }
  .till button:hover { border-color: var(--line); }
  .till button[aria-pressed="true"] { background: var(--surface-2); border-color: var(--accent); }
  .till .v { font: 12.5px var(--mono); }
  .till .fail .v, .till .fail .i { color: var(--fail); font-weight: 600; }
  .till .pass .i { color: var(--pass); }
  .paper-wrap { padding: 20px 16px 40px; display: flex; justify-content: center; align-items: flex-start; }
  .paper { width: min(820px, 100%); background: var(--surface); border: 1px solid var(--line); border-radius: 4px; box-shadow: var(--shadow); padding: 22px 26px 26px; position: relative; }
  .paper::before, .paper::after { content: ""; position: absolute; left: 0; right: 0; height: 8px; background: radial-gradient(circle at 6px -2px, transparent 6px, var(--surface) 6.5px) repeat-x; background-size: 12px 8px; }
  .paper::before { top: -8px; transform: scaleY(-1); }
  .paper::after { bottom: -8px; }
  .rhead { display: flex; justify-content: space-between; align-items: baseline; gap: 12px; flex-wrap: wrap; border-bottom: 1px dashed var(--line); padding-bottom: 10px; }
  .rhead h2 { margin: 0; font-size: 18px; }
  .rhead .meta { font: 12px var(--mono); color: var(--muted); }
  .rhead p { margin: 4px 0 0; color: var(--muted); font-size: 13px; flex-basis: 100%; }
  .item { display: grid; grid-template-columns: 26px minmax(0, 1fr) 190px; gap: 4px 12px; padding: 12px 0; border-bottom: 1px dashed var(--line); align-items: start; }
  .item .n { font: 600 12px var(--mono); color: var(--muted); padding-top: 2px; }
  .item .what { font-weight: 600; }
  .item .why { color: var(--muted); font-size: 12.5px; }
  .item .res { font: 13px var(--mono); text-align: right; }
  .item .res small { display: block; color: var(--muted); font-size: 11.5px; min-height: 1.3em; }
  .item .viz { grid-column: 2 / 4; }
  .item svg { width: 100%; display: block; overflow: visible; }
  .item.total { border-bottom: 3px double var(--ink); }
  .item.total .res { font-size: 17px; font-weight: 700; }
  .item.total .what { font-size: 15px; }
  .stamp { position: absolute; right: 22px; top: 54px; transform: rotate(-8deg); border: 3px solid; border-radius: 8px; padding: 2px 12px; font: 800 22px var(--mono); letter-spacing: .08em; opacity: .85; }
  .stamp.pass { color: var(--pass); } .stamp.fail { color: var(--fail); }
  .check { margin-top: 12px; font: 12.5px var(--mono); color: var(--muted); }
  .check b.ok { color: var(--pass); }
  .xh { stroke: var(--accent); stroke-width: 1; vector-effect: non-scaling-stroke; opacity: 0; }
  .hovering .xh { opacity: 1; }
  .ax { fill: var(--muted); font: 10px var(--mono); }
  .hit { fill: transparent; cursor: crosshair; }
  @media (max-width: 860px) {
    .app { grid-template-columns: 1fr; }
    .till { border-right: 0; border-bottom: 1px solid var(--line); display: grid; grid-template-columns: 1fr 1fr; }
    .till .sec { grid-column: 1 / 3; }
    .item { grid-template-columns: 22px minmax(0, 1fr); }
    .item .res { grid-column: 2; text-align: left; }
    .item .viz { grid-column: 1 / 3; }
    .stamp { position: static; display: inline-block; margin-top: 8px; }
    .paper { padding: 18px 14px; }
  }
</style>
</head>
<body>
<header class="topbar">
  <div class="who"><span class="no">02</span><h1>Itemized Receipt</h1><span class="thesis">Every number printed as a receipt: the line items that turn raw samples into it, each one a live picture you can hover.</span></div>
  <div class="picker" id="picker"></div>
  <button class="iconbtn" id="theme">☾ Dark</button>
</header>
<nav class="guide" id="guide"></nav>
<div class="app">
  <aside class="till" id="till"></aside>
  <main class="paper-wrap"><article class="paper" id="paper"></article></main>
</div>
<footer class="inputs" id="inputs"></footer>
<script src="../_data/fixture.js"></script>
<script src="../_shared/kit.js"></script>
<script>
const K = window.Kit, F = K.F, T = F.thresholds;
const state = { sol: K.bestId, metric: "tool_track_rms_mm", hover: null };
const h = K.hash();
if (h.s && K.byId[h.s]) state.sol = h.s;
if (h.m) state.metric = h.m;
let tr, err, moving, sat, lim, below, hovers = [];

function load(sol) {
  state.sol = sol; tr = K.trace(sol);
  err = tr.full.err_mm; moving = K.mask(tr.full.moving, tr.n);
  sat = K.mask(tr.full.sat, tr.n); lim = K.mask(tr.full.lim, tr.n); below = K.mask(tr.full.below, tr.n);
  renderTill(); renderReceipt();
}
const time = (i) => K.time(tr, i);
const W = 600;

/* ── tiny SVG builders; every chart shares x = time, so one hover drives them all ── */
function xOf(i) { return (i / (tr.n - 1)) * W; }
function frame(hgt, inner, { yTicks = "" } = {}) {
  return `<svg viewBox="0 0 ${W} ${hgt + 14}" preserveAspectRatio="none" style="height:${hgt + 14}px">${inner}${yTicks}
    <line class="xh" x1="-10" x2="-10" y1="0" y2="${hgt}"/>
    <text class="ax" x="0" y="${hgt + 12}">0 s</text><text class="ax" x="${W}" y="${hgt + 12}" text-anchor="end">${time(tr.n - 1).toFixed(2)} s</text>
    <rect class="hit" x="0" y="0" width="${W}" height="${hgt}"/></svg>`;
}
function bands(intervals, hgt, fill, opacity = 1) {
  return intervals.map(([a, b]) => `<rect x="${xOf(a)}" y="0" width="${Math.max(0.8, xOf(b) - xOf(a))}" height="${hgt}" fill="${fill}" opacity="${opacity}"/>`).join("");
}
function series(values, idxOf, hgt, max, { color = "var(--ink)", fill = null, keep = null, min = 0 } = {}) {
  let d = "", open = false;
  values.forEach((v, k) => {
    const i = idxOf(k);
    if (keep && !keep(i)) { open = false; return; }
    const y = hgt - ((v - min) / (max - min)) * hgt;
    d += `${open ? "L" : "M"}${xOf(i).toFixed(1)},${y.toFixed(1)}`;
    open = true;
  });
  return `<path d="${d}" fill="none" stroke="${color}" stroke-width="1.1" vector-effect="non-scaling-stroke"/>`;
}
function area(values, hgt, max, keep, fill = "var(--ink)") {
  let d = "", open = false, lastX = 0;
  values.forEach((v, i) => {
    if (!keep(i)) { if (open) d += `L${lastX},${hgt}Z`; open = false; return; }
    const x = xOf(i).toFixed(1), y = (hgt - (v / max) * hgt).toFixed(1);
    d += open ? `L${x},${y}` : `M${x},${hgt}L${x},${y}`;
    open = true; lastX = x;
  });
  if (open) d += `L${lastX},${hgt}Z`;
  return `<path d="${d}" fill="${fill}" opacity=".72"/>`;
}
function hline(y, hgt, max, label, color = "var(--fail)", min = 0) {
  const yy = hgt - ((y - min) / (max - min)) * hgt;
  return `<line x1="0" x2="${W}" y1="${yy}" y2="${yy}" stroke="${color}" stroke-dasharray="4 3" vector-effect="non-scaling-stroke"/><text class="ax" x="${W - 2}" y="${yy - 3}" text-anchor="end" fill="${color}">${label}</text>`;
}
function stopTicks(hgt) {
  return tr.stops.map(([a, b], j) => `<text class="ax" x="${xOf((a - tr.t0) / tr.dt) + 2}" y="10">S${j + 1}</text>`).join("");
}
function dotStrip(values, mark, { log = true, label = (v) => K.sig(v, 2), highlight, extra = "" } = {}) {
  const lo = Math.min(...values) / 1.5, hi = Math.max(...values) * 1.5;
  const x = (v) => (log ? (Math.log(v) - Math.log(lo)) / (Math.log(hi) - Math.log(lo)) : (v - lo) / (hi - lo)) * (W - 20) + 10;
  const dots = values.map((v, i) => `<circle cx="${x(v)}" cy="22" r="${highlight(i) ? 6 : 4}" fill="${highlight(i) ? "var(--accent)" : "var(--faint)"}" ${highlight(i) ? 'stroke="var(--surface)" stroke-width="2"' : ""}><title>${label(v)}</title></circle>`).join("");
  return `<svg viewBox="0 0 ${W} 50" style="height:50px"><line x1="10" x2="${W - 10}" y1="22" y2="22" stroke="var(--line)"/>
    <line x1="${x(mark)}" x2="${x(mark)}" y1="6" y2="38" stroke="var(--ink)" stroke-width="2"/><text class="ax" x="${x(mark)}" y="48" text-anchor="middle" fill="var(--ink)">median ${label(mark)}</text>
    ${dots}${extra}<text class="ax" x="10" y="48">${label(lo * 1.5)}</text><text class="ax" x="${W - 10}" y="48" text-anchor="end">${label(hi / 1.5)}</text></svg>`;
}

function rankStrip(pi) {
  const v = K.pop.map((x) => x.objective), lo = Math.min(...v) / 2, hi = Math.max(...v) * 2;
  const x = (u) => ((Math.log(u) - Math.log(lo)) / (Math.log(hi) - Math.log(lo))) * (W - 40) + 20;
  return `<svg viewBox="0 0 ${W} 56" style="height:56px"><line x1="20" x2="${W - 20}" y1="30" y2="30" stroke="var(--line)"/>` +
    K.pop.map((s, i) => `<circle cx="${x(s.objective)}" cy="30" r="${i === pi ? 6.5 : 4.5}" fill="${s.admissible ? (i === pi ? "var(--accent)" : "var(--faint)") : "var(--surface)"}" stroke="${s.admissible ? "var(--surface)" : "var(--fail)"}" stroke-width="2"/>` +
      (i === pi || i === 0 ? `<text class="ax" x="${x(s.objective)}" y="${i === pi ? 16 : 50}" text-anchor="middle" fill="${i === pi ? "var(--ink)" : "var(--muted)"}">#${s.rank} ${s.id} ${K.sig(s.objective, 2)} mm${s.admissible ? "" : " ✗"}</text>` : `<title>#${s.rank} ${s.id}</title>`)).join("") +
    `<text class="ax" x="20" y="50">${K.pop.filter((s) => s.admissible).length} admissible (filled) · ${K.pop.filter((s) => !s.admissible).length} not (red ring)</text></svg>`;
}

/* ── the receipts ── */
const R = {};
R.tool_track_rms_mm = () => {
  let n = 0, s2 = 0, peak = 0;
  for (let i = 0; i < tr.n; i++) if (moving[i]) { n++; s2 += err[i] ** 2; if (err[i] > peak) peak = err[i]; }
  const ms = s2 / n, rms = Math.sqrt(ms);
  const sorted = []; for (let i = 0; i < tr.n; i++) if (moving[i]) sorted.push(err[i] ** 2);
  sorted.sort((a, b) => b - a);
  const top = Math.ceil(0.1 * n), topShare = sorted.slice(0, top).reduce((a, b) => a + b, 0) / s2;
  const cut = sorted[top - 1];
  const s = K.byId[state.sol], taskRms = s.tasks.map((x) => x.tool_track_rms_mm), ti = s.tasks.findIndex((x) => x.task === tr.task);
  const popObj = K.pop.map((x) => x.objective), pi = K.pop.findIndex((x) => x.id === state.sol);
  const H = 54;
  return {
    title: "Tool tracking error", code: "tool_track_rms_mm", verdict: null,
    blurb: K.OBJECTIVE.how,
    items: [
      { what: "Record every sample", why: `Joint encoders → tool point through the same FK as the target (${F.deployment.tool_point}).`,
        res: `${K.fmt.int(tr.n)} samples`, viz: frame(18, bands([[0, tr.n - 1]], 18, "var(--surface-2)") + stopTicks(18)), hover: (i) => `${time(i).toFixed(3)} s` },
      { what: "Keep the moving ones", why: `Target tool faster than ${T.moving_tool_mm_s} mm/s, or any target joint faster than ${T.moving_joint_deg_s}°/s. Stops don't count.`,
        res: `${K.fmt.int(n)} kept<small>${K.fmt.int(tr.n - n)} at rest dropped</small>`, viz: frame(18, bands([[0, tr.n - 1]], 18, "var(--rest)", 0.5) + bands(tr.full.moving, 18, "var(--ink)", 0.75)),
        hover: (i) => (moving[i] ? "moving: kept" : "at rest: dropped") },
      { what: "Distance target → measured tool point", why: "At the same instant, in millimetres.",
        res: `peak ${K.fmt.mm(peak)}`, viz: frame(H, bands(tr.full.moving, H, "var(--surface-2)") + area(err, H, peak * 1.05, (i) => moving[i])),
        hover: (i) => (moving[i] ? `e = ${K.fmt.mm(err[i])}` : "—") },
      { what: "Square each distance", why: `Big misses weigh more: the worst 10 % of samples (accent) carry <b>${(topShare * 100).toFixed(0)} %</b> of the total.`,
        res: `Σ e² = ${K.sig(s2, 4)} mm²`, viz: frame(H, bands(tr.full.moving, H, "var(--surface-2)") + area(err.map((e) => e * e), H, peak * peak * 1.05, (i) => moving[i], "var(--faint)") +
          err.map((e, i) => (moving[i] && e * e >= cut ? `<rect x="${xOf(i)}" y="${H - (e * e) / (peak * peak * 1.05) * H}" width="1.2" height="${(e * e) / (peak * peak * 1.05) * H}" fill="var(--accent)"/>` : "")).join("")),
        hover: (i) => (moving[i] ? `e² = ${K.sig(err[i] ** 2, 3)} mm²` : "—") },
      { what: "Mean of the squares", why: `Σ e² ÷ ${K.fmt.int(n)} samples.`, res: `${K.sig(ms, 4)} mm²` },
      { what: "Square root", why: "Back to millimetres: this task's tracking error.", res: `<b>${K.fmt.mm(rms)}</b>`, total: false },
      { what: "Median over the dev tasks", why: `Each dot is one task's RMS for this solution (log scale); this task is the large one. The median is the objective.`,
        res: `<b>${K.fmt.mm(s.objective)}</b><small>${F.tasks_used} tasks</small>`, viz: dotStrip(taskRms, s.objective, { highlight: (i) => i === ti, label: (v) => `${K.sig(v, 2)} mm` }), total: true },
      { what: "Where it ranks", why: `Every solution's objective (log scale); ${s.admissible ? "admissible, so it ranks on this number" : "not admissible, so it ranks after every admissible one"}.`,
        res: `rank ${s.rank} of ${K.pop.length}`, viz: rankStrip(pi) },
    ],
    check: [rms, tr.kpis.tool_track_rms_mm, "mm", `from the ${K.fmt.int(tr.n)} per-sample distances`],
  };
};
R.stop_error_max_mm = () => {
  const H = 40, ok = tr.gates.stop_error_max_mm, worst = Math.max(...tr.stop_errors_mm);
  const tails = tr.stops.map(([a, b]) => [Math.round((b - T.stop_tail_s - tr.t0) / tr.dt), Math.round((b - tr.t0) / tr.dt)]);
  const maxv = Math.max(T.stop_error_max_mm * 1.3, worst * 1.1);
  const bars = `<svg viewBox="0 0 ${W} 74" style="height:74px">${tr.stop_errors_mm.map((e, j) => {
    const x = 30 + j * ((W - 60) / tr.stops.length), w = (W - 60) / tr.stops.length - 18, bh = Math.max(1.5, (e / maxv) * 56);
    return `<rect x="${x}" y="${58 - bh}" width="${w}" height="${bh}" fill="${e <= T.stop_error_max_mm ? "var(--pass)" : "var(--fail)"}" opacity=".8"/><text class="ax" x="${x + w / 2}" y="70" text-anchor="middle">S${j + 1} ${K.sig(e, 2)} mm</text>`;
  }).join("")}<line x1="20" x2="${W - 20}" y1="${58 - (T.stop_error_max_mm / maxv) * 56}" y2="${58 - (T.stop_error_max_mm / maxv) * 56}" stroke="var(--fail)" stroke-dasharray="4 3"/><text class="ax" x="22" y="${54 - (T.stop_error_max_mm / maxv) * 56}" fill="var(--fail)">gate ${T.stop_error_max_mm} mm</text></svg>`;
  return {
    title: "Stop error", code: "stop_error_max_mm", verdict: ok,
    blurb: `How far from the target the arm actually comes to rest. Gate: ≤ ${T.stop_error_max_mm} mm at every stop.`,
    items: [
      { what: "Find the stops", why: `Spans where the target is at rest for at least ${T.stop_min_s} s.`, res: `${tr.stops.length} stops`,
        viz: frame(18, bands(tr.stops.map(([a, b]) => [Math.round((a - tr.t0) / tr.dt), Math.round((b - tr.t0) / tr.dt)]), 18, "var(--surface-2)") + stopTicks(18)), hover: (i) => `${time(i).toFixed(2)} s` },
      { what: `Take each stop's last ${T.stop_tail_s} s`, why: "The arm has had time to settle; this is where it rests.", res: `${Math.round(T.stop_tail_s / tr.dt) + 1} samples each`,
        viz: frame(18, bands(tails, 18, "var(--ink)", 0.8) + stopTicks(18)) },
      { what: "Mean measured tool point vs the target", why: "One distance per stop.", res: tr.stop_errors_mm.map((e) => K.sig(e, 2)).join(" · ") + " mm", viz: bars },
      { what: "Worst stop", why: `Compared with the gate's ${T.stop_error_max_mm} mm.`, res: `<b class="${ok ? "" : "bad"}">${K.fmt.mm(worst)} ${ok ? "≤" : ">"} ${T.stop_error_max_mm} mm</b>`, total: true },
    ],
    check: [worst, tr.kpis.stop_error_max_mm, "mm", "from the per-stop distances"],
  };
};
function jointLines(rows, H, maxAbs, failAt, label) {
  const cols = ["#2f5bd3", "#c2410c", "#0f766e", "#7c3aed", "#b45309", "#be185d"];
  return rows[0].map((_, j) => series(rows.map((r) => Math.abs(r[j])), (k) => tr.idx[k], H, maxAbs, { color: cols[j] })).join("") + (failAt ? hline(failAt, H, maxAbs, label) : "");
}
function jointLegend() {
  const cols = ["#2f5bd3", "#c2410c", "#0f766e", "#7c3aed", "#b45309", "#be185d"];
  return F.deployment.joints.map((n, j) => `<span style="white-space:nowrap"><span class="sw" style="display:inline-block;width:12px;height:3px;background:${cols[j]};vertical-align:middle;margin-right:3px"></span>${n}</span>`).join(" ");
}
function peakOf(rows) { let b = [0, 0, 0]; rows.forEach((r, k) => r.forEach((v, j) => { if (Math.abs(v) > b[0]) b = [Math.abs(v), j, k]; })); return b; }
R.saturation_share_pct = () => {
  const H = 64, c = sat.reduce((a, b) => a + b, 0), share = (100 * c) / tr.n, ok = tr.gates.saturation_share_pct;
  const [pk, pj, pkk] = peakOf(tr.tau_pct);
  return {
    title: "Torque saturation", code: "saturation_share_pct", verdict: ok,
    blurb: `How often any joint is pinned at its torque cap. Gate: ≤ ${T.saturation_share_pct} % of samples.`,
    items: [
      { what: "Each joint's torque as a share of its cap", why: `Caps ${F.deployment.tau_cap_nm.join(" / ")} N·m. ${jointLegend()}`, res: `peak ${pk.toFixed(1)} %<small>${F.deployment.joints[pj]} at ${time(tr.idx[pkk]).toFixed(2)} s</small>`,
        viz: frame(H, jointLines(tr.tau_pct, H, 100, 100 * T.sat_fraction, `${Math.round(100 * T.sat_fraction)} % = saturated`)),
        hover: (i) => { const r = tr.tau_pct[K.near(tr, i)]; const j = r.reduce((b, v, jj) => (Math.abs(v) > Math.abs(r[b]) ? jj : b), 0); return `${F.deployment.joints[j]} ${Math.abs(r[j]).toFixed(0)} %`; } },
      { what: `Flag samples with any joint ≥ ${Math.round(100 * T.sat_fraction)} %`, why: "Red ticks mark flagged samples on this 100 Hz record; the gate flags every 4 kHz physics sample the same way.", res: `${K.fmt.int(c)} of ${K.fmt.int(tr.n)} here`,
        viz: frame(14, bands([[0, tr.n - 1]], 14, "var(--surface-2)") + bands(tr.full.sat, 14, "var(--fail)")) },
      { what: "Share of all physics samples", why: `The gate's count over the 4 kHz physics samples (the scorecard); on this page's 100 Hz samples it is ${K.fmt.pct(share)}.`, res: `<b class="${ok ? "" : "bad"}">${K.fmt.pct(tr.kpis.saturation_share_pct)} ${ok ? "≤" : ">"} ${T.saturation_share_pct} %</b>`, total: true },
    ],
    note: `Counted by the ruler on 4 kHz physics samples (scorecard ${K.fmt.pct(tr.kpis.saturation_share_pct)}); this page's ${K.fmt.int(tr.n)} record samples give ${K.fmt.pct(share)}, so the flags show where, not the count.`,
  };
};
R.limit_violations = () => {
  const H = 64, c = lim.reduce((a, b) => a + b, 0), ok = tr.gates.limit_violations;
  const [pk, pj, pkk] = peakOf(tr.qd_pct);
  const posPct = tr.q_deg[0].map((_, j) => Math.max(...tr.q_deg.map((r) => Math.abs(r[j]))) / F.deployment.q_limit_deg[j] * 100);
  return {
    title: "Joint limits", code: "limit_violations", verdict: ok,
    blurb: `Samples outside a joint's position range, or faster than ${T.vel_margin} × its velocity limit. Gate: 0.`,
    items: [
      { what: "Each joint's speed as a share of its limit", why: `Limit ${F.deployment.qd_max_deg_s[0]}°/s every joint (UR datasheet). ${jointLegend()}`, res: `peak ${pk.toFixed(1)} %<small>${F.deployment.joints[pj]} at ${time(tr.idx[pkk]).toFixed(2)} s</small>`,
        viz: frame(H, jointLines(tr.qd_pct, H, Math.max(110, ...tr.qd_pct.flat().map(Math.abs)) * 1.02, 100 * T.vel_margin, `${Math.round(100 * T.vel_margin)} % = violation`) + bands(tr.full.lim, 3, "var(--fail)")),
        hover: (i) => { const r = tr.qd_pct[K.near(tr, i)]; const j = r.reduce((b, v, jj) => (Math.abs(v) > Math.abs(r[b]) ? jj : b), 0); return `${F.deployment.joints[j]} ${Math.abs(r[j]).toFixed(0)} %`; } },
      { what: "Each joint's furthest reach into its range", why: `Range ±${F.deployment.q_limit_deg.join(" / ±")}°.`, res: `max ${Math.max(...posPct).toFixed(0)} % of range`,
        viz: `<svg viewBox="0 0 ${W} 30" style="height:30px">${posPct.map((p, j) => `<rect x="${j * (W / 6) + 4}" y="6" width="${(W / 6 - 12) * p / 100}" height="10" fill="var(--ink)" opacity=".7"/><rect x="${j * (W / 6) + 4}" y="6" width="${W / 6 - 12}" height="10" fill="none" stroke="var(--line)"/><text class="ax" x="${j * (W / 6) + 4}" y="28">${F.deployment.joints[j]} ${p.toFixed(0)} %</text>`).join("")}</svg>` },
      { what: "Count violating physics samples", why: `The gate counts 4 kHz physics samples; this 100 Hz record flags ${K.fmt.int(c)} of its ${K.fmt.int(tr.n)} samples (red ticks on line 01).`, res: `<b class="${ok ? "" : "bad"}">${K.fmt.int(tr.kpis.limit_violations)} ${ok ? "= 0" : "> 0"}</b>`, total: true },
    ],
    note: `Counted by the ruler on 4 kHz physics samples (scorecard ${K.fmt.int(tr.kpis.limit_violations)}); this page's 100 Hz record flags ${K.fmt.int(c)}.`,
  };
};
R.floor_clearance = () => {
  const H = 54, c = below.reduce((a, b) => a + b, 0), ok = tr.gates.floor_clearance, lowv = tr.full.lowest_mm;
  const mx = Math.max(...lowv) * 1.05;
  return {
    title: "Floor clearance", code: "floor_clearance", verdict: ok,
    blurb: "The tool point and every link origin must stay above the floor plane (z = 0 at the base). Gate: 0 samples below.",
    items: [
      { what: "Lowest point of the arm at every sample", why: "The lowest of the tool point and the six link origins, height above the floor.", res: `closest ${tr.kpis.min_clearance_mm.toFixed(0)} mm<small>${F.deployment.links[tr.lowest_link]} at ${time(tr.lowest_i).toFixed(2)} s</small>`,
        viz: frame(H, series(lowv, (k) => k, H, mx) + hline(0, H, mx, "floor", "var(--fail)")), hover: (i) => `${lowv[i].toFixed(0)} mm above` },
      { what: "Count physics samples below the floor", why: `The gate counts 4 kHz physics samples; this 100 Hz record has ${K.fmt.int(c)} below.`, res: `<b class="${ok ? "" : "bad"}">${K.fmt.int(tr.kpis.floor_clearance)} ${ok ? "= 0" : "> 0"}</b>`, total: true },
    ],
  };
};
R.completed = () => {
  const ok = tr.gates.completed, last = tr.stops.at(-1);
  return {
    title: "Completed", code: "completed", verdict: ok,
    blurb: "A crash is not a score: the run must finish cleanly before anything else counts.",
    items: [
      { what: "No crash, no NaN, reaches the end", why: "Every command is a finite number and the run lasts to the trajectory's end.", res: `${time(tr.n - 1).toFixed(2)} s recorded` },
      { what: "Settles", why: `The tool stays within 1 mm of the target over the last 0.1 s of the final stop (target at rest ≥ ${T.stop_min_s} s).${tr.notes.length ? ` <span class="bad">${tr.notes[0]}</span>` : ""}`, res: `${last[0].toFixed(2)}–${last[1].toFixed(2)} s<small>settle error ${K.fmt.mm(tr.kpis.settle_error_max_mm)}</small>`,
        viz: frame(18, bands([[Math.round((last[0] - tr.t0) / tr.dt), tr.n - 1]], 18, "var(--ink)", 0.7) + stopTicks(18)) },
      { what: "Verdict", why: "", res: `<b class="${ok ? "" : "bad"}">${ok ? "completed" : "not completed"}</b>`, total: true },
    ],
  };
};
R.tool_lag_ms = () => {
  const H = 70, lag = tr.kpis.tool_lag_ms;
  // the joint that moves most shows the offset best
  const span = tr.target_q_deg[0].map((_, j) => Math.max(...tr.target_q_deg.map((r) => r[j])) - Math.min(...tr.target_q_deg.map((r) => r[j])));
  const j = span.indexOf(Math.max(...span));
  const tq = tr.target_q_deg.map((r) => r[j]), mq = tr.q_deg.map((r) => r[j]);
  const lo = Math.min(...tq, ...mq), hi = Math.max(...tq, ...mq);
  const shift = lag / 1000 / tr.dt; // samples
  return {
    title: "Tool lag", code: "tool_lag_ms", verdict: null,
    blurb: "Diagnostic: how late the measured motion runs behind the target. Found by sliding the measured joint angles in time until they line up best with the target (robot_msgs estimate_time_offset).",
    items: [
      { what: `Target and measured angle, ${F.deployment.joints[j]}`, why: `The joint that moves most (${span[j].toFixed(0)}°). Grey = target, ink = measured.`, res: "",
        viz: frame(H, series(tq, (k) => tr.idx[k], H, hi, { color: "var(--target)", min: lo }) + series(mq, (k) => tr.idx[k], H, hi, { min: lo })),
        hover: (i) => { const k = K.near(tr, i); return `${(mq[k] - tq[k]).toFixed(3)}° apart`; } },
      { what: "Slide the measured curve earlier", why: "The offset that makes the two coincide (accent) is the lag.", res: "",
        viz: frame(H, series(tq, (k) => tr.idx[k], H, hi, { color: "var(--target)", min: lo }) + series(mq, (k) => tr.idx[k] - shift, H, hi, { color: "var(--accent)", min: lo })) },
      { what: "Lag", why: "", res: `<b>${K.fmt.ms(lag)}</b>`, total: true },
    ],
  };
};
R.joint_track_rms_deg = () => {
  const H = 64, maxv = Math.max(...tr.err_deg.flat().map(Math.abs)) * 1.05;
  const worst = tr.joint_rms_deg.indexOf(Math.max(...tr.joint_rms_deg));
  return {
    title: "Joint tracking (worst joint)", code: "joint_track_rms_deg", verdict: null,
    blurb: "Diagnostic: the angle error of each joint, the worst joint's RMS over the moving samples.",
    items: [
      { what: "Each joint's angle error", why: jointLegend(), res: `peak ${K.sig(maxv / 1.05, 3)}°`, viz: frame(H, bands(tr.full.moving, H, "var(--surface-2)") + jointLines(tr.err_deg, H, maxv)) },
      { what: "RMS per joint over the moving samples", why: "", res: tr.joint_rms_deg.map((v) => K.sig(v, 2)).join(" · ") + "°",
        viz: `<svg viewBox="0 0 ${W} 30" style="height:30px">${tr.joint_rms_deg.map((p, j) => `<rect x="${j * (W / 6) + 4}" y="6" width="${(W / 6 - 12) * p / Math.max(...tr.joint_rms_deg)}" height="10" fill="${j === worst ? "var(--accent)" : "var(--faint)"}"/><text class="ax" x="${j * (W / 6) + 4}" y="28">${F.deployment.joints[j]}</text>`).join("")}</svg>` },
      { what: "Worst joint", why: F.deployment.joints[worst], res: `<b>${K.fmt.deg(tr.kpis.joint_track_rms_deg)}</b>`, total: true },
    ],
    check: [Math.max(...tr.joint_rms_deg), tr.kpis.joint_track_rms_deg, "°", "from the per-joint RMS"],
  };
};
R.energy_j = () => {
  const H = 64, pos = tr.power_w.map((r) => r.map((v) => Math.max(0, v)));
  const mx = Math.max(...pos.flat()) * 1.05;
  let approx = 0; pos.forEach((r, k) => { const dt = k ? (tr.idx[k] - tr.idx[k - 1]) * tr.dt : 0; approx += r.reduce((a, b) => a + b, 0) * dt; });
  return {
    title: "Motor energy", code: "energy_j", verdict: null,
    blurb: "Diagnostic: positive mechanical work the joints deliver (torque × speed, positive part), summed over joints and time.",
    items: [
      { what: "Power per joint, positive part", why: jointLegend(), res: `peak ${(mx / 1.05).toFixed(0)} W`, viz: frame(H, jointLines(pos, H, mx)) },
      { what: "Sum the joints, integrate over time", why: `From these 100 Hz samples ≈ ${approx.toFixed(1)} J; the scorecard integrates all ${tr.n} samples.`, res: `<b>${tr.kpis.energy_j.toFixed(1)} J</b>`, total: true },
    ],
  };
};

/* ── layout ── */
const ORDER = [["Objective", ["tool_track_rms_mm"]], ["Gates", K.GATES.map((g) => g.id)], ["Diagnostics", K.DIAGNOSTICS.map((d) => d.id)]];
function valueOf(id) {
  const k = tr.kpis;
  if (id === "tool_track_rms_mm") return K.fmt.mm(k.tool_track_rms_mm);
  const g = K.GATES.find((x) => x.id === id); if (g) return g.show(k);
  return K.DIAGNOSTICS.find((x) => x.id === id).show(k);
}
const labelOf = (id) => id === "tool_track_rms_mm" ? K.OBJECTIVE.label : (K.GATES.find((x) => x.id === id) || K.DIAGNOSTICS.find((x) => x.id === id)).label;
function renderTill() {
  document.getElementById("till").innerHTML = ORDER.map(([sec, ids]) => `<div class="sec">${sec}</div>` + ids.map((id) => {
    const isGate = K.GATES.some((g) => g.id === id), ok = isGate ? tr.gates[id] : null;
    return `<button data-m="${id}" class="${ok === null ? "" : ok ? "pass" : "fail"}" aria-pressed="${state.metric === id}"><span class="i">${ok === null ? "·" : ok ? "✓" : "✗"}</span><span>${labelOf(id)}</span><span class="v">${valueOf(id)}</span></button>`;
  }).join("")).join("");
}
document.getElementById("till").addEventListener("click", (e) => {
  const b = e.target.closest("[data-m]"); if (!b) return;
  state.metric = b.dataset.m; renderTill(); renderReceipt();
  guide.sync((s) => s.m === state.metric && s.sol === state.sol);
});
function renderReceipt() {
  const r = R[state.metric]();
  const s = K.byId[state.sol];
  hovers = [];
  const items = r.items.map((it, n) => { hovers.push(it.hover || null); return `<div class="item ${it.total ? "total" : ""}" data-item="${n}"><span class="n">${String(n + 1).padStart(2, "0")}</span><div><div class="what">${it.what}</div><div class="why">${it.why}</div></div><div class="res">${it.res}${it.hover ? "<small class='hv'></small>" : ""}</div>${it.viz ? `<div class="viz">${it.viz}</div>` : ""}</div>`; }).join("");
  let check = "";
  if (r.note) check = `<div class="check">${r.note}</div>`;
  if (r.check) {
    const [here, card, unit, from] = r.check, same = K.sig(here, 3) === K.sig(card, 3);
    check = `<div class="check">Recomputed in this page ${from}: ${K.sig(here, 3)} ${unit} · scorecard: ${K.sig(card, 3)} ${unit} · <b class="${same ? "ok" : "bad"}">${same ? "equal" : "DIFFERENT"}</b></div>`;
  }
  const stamp = r.verdict === null ? "" : `<div class="stamp ${r.verdict ? "pass" : "fail"}">${r.verdict ? "PASS" : "FAIL"}</div>`;
  document.getElementById("paper").innerHTML = `<div class="rhead"><h2>${r.title}</h2><span class="meta">${r.code} · ${state.sol} · ${tr.task}</span><p>${r.blurb}</p></div>${stamp}${items}${check}`;
}
/* one hover drives every chart on the receipt */
document.getElementById("paper").addEventListener("pointermove", (e) => {
  const svg = e.target.closest("svg"); if (!svg || !svg.querySelector(".hit")) return;
  const r = svg.getBoundingClientRect(), f = Math.max(0, Math.min(1, (e.clientX - r.left) / r.width));
  setHover(Math.round(f * (tr.n - 1)));
});
function setHover(i) {
  const x = xOf(i);
  document.getElementById("paper").classList.add("hovering");
  document.querySelectorAll("#paper .xh").forEach((l) => { l.setAttribute("x1", x); l.setAttribute("x2", x); });
  document.querySelectorAll("#paper .item").forEach((el) => { const f = hovers[+el.dataset.item]; const hv = el.querySelector(".hv"); if (f && hv) hv.textContent = `${time(i).toFixed(2)} s · ${f(i)}`; });
}

const setPick = K.picker(document.getElementById("picker"), state.sol, (sol) => { load(sol); setPick(sol); guide.sync((s) => s.m === state.metric && s.sol === state.sol); });
K.theme(document.getElementById("theme"), () => renderReceipt());
const guide = K.guide(document.getElementById("guide"), [
  { label: "The objective's receipt", caption: "Read top to bottom: raw samples → keep the moving ones → distance → square → mean → root → median over tasks.", m: "tool_track_rms_mm", sol: K.bestId, target: '[data-m="tool_track_rms_mm"]', hover: K.trace(K.bestId).peak_err_i },
  { label: "Where it came from", caption: "Line 04: the worst tenth of the samples (accent) carries a large share of the squared error; hover any chart to read one sample on every line.", m: "tool_track_rms_mm", sol: K.bestId, target: '[data-item="3"]', hover: K.trace(K.bestId).peak_err_i },
  { label: "A gate's receipt", caption: "Stop error: find stops → last 0.1 s → distance per stop → worst vs 1 mm. Stamped PASS.", m: "stop_error_max_mm", sol: K.bestId, target: '[data-m="stop_error_max_mm"]' },
  { label: "A failing receipt", caption: `Same receipt, a failing solution (${K.failingId}): it rests ${K.fmt.mm(K.trace(K.failingId).kpis.stop_error_max_mm)} from the target. Stamped FAIL.`, m: "stop_error_max_mm", sol: K.failingId, target: `[data-sol="${K.failingId}"]` },
  { label: "A torque gate fails", caption: "Torque saturation: the joints' torque against the 98 % line, the flagged samples, and the gate's 4 kHz share. Stamped FAIL.", m: "saturation_share_pct", sol: K.failingId, target: '[data-m="saturation_share_pct"]' },
], (s) => { state.metric = s.m; if (s.sol !== state.sol) { load(s.sol); setPick(s.sol); } else { renderTill(); renderReceipt(); } if (s.hover) setHover(s.hover); });
K.footer(document.getElementById("inputs"), {
  reads: ["target trajectory", "measured joint states", "applied torques", "deployment", "ruler v1"],
  generalises: "Best of the five: any metric that is a chain of reductions over samples (filter → per-sample value → reduce → compare) prints as a receipt, for any robot or any black box. A new metric is a list of line items, each with an optional sparkline; no geometry needed. It shows how a number is made, less where in space it happened.",
});
load(state.sol);
setPick(state.sol);
if (h.step) guide.show(+h.step - 1); else guide.show(-1);
</script>
</body>
</html>
